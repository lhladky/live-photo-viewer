name: Release

# Fully automated releases via release-please.
#
# On every push to main, release-please maintains a "Release vX.Y.Z" pull
# request that bumps the version and updates CHANGELOG.md from your Conventional
# Commits. Merging that PR creates the git tag + GitHub Release (with notes), and
# the build job below then packages every OS and uploads the installers to it.
#
# The build lives in THIS workflow on purpose: a tag created by the default
# GITHUB_TOKEN does not trigger a separate tag-listening workflow, so we gate the
# build on release-please's `release_created` output instead.
#
# Each OS builds on its own runner because ffmpeg-static installs only the host
# platform's ffmpeg binary (a Windows build must run on Windows).

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Uploads installers to the Release that release-please already created for
      # this tag (electron-builder finds it by version and attaches assets).
      - name: Package & publish
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
