# Manual, release-please-driven releases.
#
# Each OS builds on its own runner because ffmpeg-static installs only the host
# platform's ffmpeg binary (a Windows build must run on Windows).

name: Release

on:
  workflow_dispatch:
    inputs:
      rebuild_tag:
        description: "Rebuild installers from this ref (tag or branch, e.g. v1.0.0 or main) and attach them to the release matching package.json's version. Leave blank for the normal release-please flow."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Skipped when rebuilding an existing tag.
    if: ${{ inputs.rebuild_tag == '' }}
    runs-on: ubuntu-slim
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release-please
    # Runs after a fresh release-please release, OR standalone when rebuilding an
    # existing tag (release-please is skipped then, hence always() + the guard).
    if: ${{ always() && (inputs.rebuild_tag != '' || needs.release-please.outputs.release_created == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      # Blank ref = the tag/branch that triggered the run (normal flow); when
      # rebuilding, check out the requested tag so package.json has its version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rebuild_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Uploads installers to the Release that release-please already created for
      # this tag (electron-builder finds it by version and attaches assets).
      - name: Package & publish
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
